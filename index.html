<body>
    <!-- Деревянный ободок стола казино -->
    <div class="casino-table-border">
        <div id="game-container">
            
            <!-- Шапка: Профиль, Онлайн, Кнопка переключения и Звук -->
            <div class="user-profile">
                <div class="user-info-left" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span id="user-name" class="user-name">Игрок</span>
                    <span class="online-badge">🟢 <span id="online-count">24</span> онлайн</span>
                    <a href="https://jefbull.github.io/burkozel/" style="background: #2b5278; color: #fff; padding: 3px 8px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: bold; display: inline-block;">🐐 В Буркозёл</a>
                </div>
                <div class="top-right-panel">
                    <button id="sound-toggle" onclick="toggleSound()">🔊</button>
                    <div class="balance-badge">🪙 <span id="balance">10000</span></div>
                </div>
            </div>

            <!-- Верхняя панель ставок и фишек -->
            <div class="chips-container" id="chips-area">
                <div class="chips-title">Ставка: <span id="current-bet">50</span> 🪙</div>
                <div class="chips-grid">
                    <button class="chip chip-50 active" onclick="selectBet(50)">50</button>
                    <button class="chip chip-100" onclick="selectBet(100)">100</button>
                    <button class="chip chip-250" onclick="selectBet(250)">250</button>
                    <button class="chip chip-500" onclick="selectBet(500)">500</button>
                    <button class="chip chip-1000" onclick="selectBet(1000)">1k</button>
                    <button class="chip chip-2500" onclick="selectBet(2500)">2.5k</button>
                    <button class="chip chip-5000" onclick="selectBet(5000)">5k</button>
                    <button class="chip chip-10000" onclick="selectBet(10000)">10k</button>
                    <button class="chip chip-25000" onclick="selectBet(25000)">25k</button>
                </div>
            </div>

            <!-- Зона дилера -->
            <div class="hand">
                <div id="dealer-cards" class="cards-row"></div>
                <div class="score-pill">dealer: <span id="dealer-score">0</span></div>
            </div>

            <!-- Колода по центру в деревянном боксе -->
            <div class="deck-box">
                <div class="deck-container">
                    <div class="deck-card deck-3"></div>
                    <div class="deck-card deck-2"></div>
                    <div class="deck-card deck-1">🂠</div>
                </div>
            </div>

            <!-- Зона игрока -->
            <div class="hand">
                <div id="player-cards" class="cards-row"></div>
                <div class="score-pill"><span id="player-score">0</span></div>
            </div>

            <div id="status-message">Сделайте ставку и начните игру!</div>

            <!-- Нижняя панель крупных кнопок в стиле референса -->
            <div class="controls">
                <button id="btn-start" class="btn-action btn-blue" onclick="startGame()">Новая игра</button>
                <button id="btn-hit" class="btn-action" onclick="hit()" disabled>Еще</button>
                <button id="btn-double" class="btn-action btn-gold" onclick="doubleDown()" disabled>Удвоить</button>
                <button id="btn-stand" class="btn-action" onclick="stand()" disabled>Пас</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
