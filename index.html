<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Буркозёл — Casino Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для выделения выбранных карт */
        .card.selected-card {
            transform: translateY(-10px);
            box-shadow: 0 0 10px #ffd700;
            border-color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="casino-table-border">
        <div id="game-container">
            <div class="user-profile">
                <div class="user-info-left" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span id="user-name" class="user-name">Игрок</span>
                    <a href="https://jefbull.github.io/o4ko/" style="background: #2b5278; color: #fff; padding: 3px 8px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: bold; display: inline-block;">♠️ В игру 21</a>
                </div>
                <div class="top-right-panel">
                    <div class="balance-badge" id="game-score">Штраф: 0</div>
                </div>
            </div>

            <h1>🐐 Буркозёл</h1>
            
            <div class="table-center" style="display: flex; justify-content: center; gap: 15px; margin: 15px 0;">
                <div class="deck-container">
                    <div class="deck-card deck-3"></div>
                    <div class="deck-card deck-2"></div>
                    <div class="deck-card deck-1">🂠</div>
                </div>
                <div id="trump-container" class="trump-card-place" title="Козырь"></div>
            </div>

            <div class="hand">
                <h2>Противник: <span id="bot-cards-count">4 карты</span></h2>
                <div id="bot-cards" class="cards-row" style="display: flex; justify-content: center; gap: 5px;"></div>
            </div>

            <div class="hand table-trick" style="margin: 10px 0; min-height: 80px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px;">
                <h3 style="margin: 0 0 5px 0; font-size: 14px; text-align: center;">Взятка на столе</h3>
                <div id="trick-cards" class="cards-row" style="display: flex; justify-content: center; gap: 5px;"></div>
            </div>

            <div class="hand">
                <h2>Ваши карты:</h2>
                <div id="player-cards" class="cards-row" style="display: flex; justify-content: center; gap: 5px;"></div>
            </div>

            <div id="status-message" style="text-align: center; margin: 10px 0; font-weight: bold; color: #ffd700;">Нажмите «Новая игра», чтобы начать!</div>

            <div class="controls" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button id="btn-start" class="btn-action btn-blue" onclick="startGame()" style="padding: 10px 20px; font-weight: bold;">Новая игра</button>
                <button id="btn-pass" class="btn-action btn-gold" onclick="passTurn()" disabled style="padding: 10px 20px; font-weight: bold;">Ход / Положить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
